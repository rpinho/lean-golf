name: Check submission

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check runner disk for the Mathlib image
        run: |
          # 11-27: hosted runners now have ~110 GB free; deleting preinstalled SDKs took 5-6 minutes of the budget.
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Check the proposed proof
        env:
          GOLF_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/ci.py check
      - name: Upload checker result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golfcheck
          path: result.json
          if-no-files-found: warn
          retention-days: 7
