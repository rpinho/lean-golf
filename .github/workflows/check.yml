name: Check submission

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check the proposed proof
        run: python3 scripts/ci.py check
      - name: Upload checker result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golfcheck
          path: result.json
          if-no-files-found: warn
          retention-days: 7
