name: Check submission

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Free runner disk for the Mathlib image
        run: |
          # The hosted runner has about 14 GB free; the pinned Lean + Mathlib image needs more. Drop preinstalled SDKs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Check the proposed proof
        run: python3 scripts/ci.py check
      - name: Upload checker result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golfcheck
          path: result.json
          if-no-files-found: warn
          retention-days: 7
